[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flux-action"
version = "0.1.0.dev0"
description = "Standalone FLUX Action model and DROID workflow"
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.11.0; sys_platform == 'darwin'", "torchvision>=0.26.0; sys_platform == 'darwin'", "torch>=2.10.0; sys_platform != 'darwin'", "torchvision>=0.25.0; sys_platform != 'darwin'", "numpy>=2.0,<2.3", "einops==0.8.1", "safetensors>=0.4.3,<1"]

[project.optional-dependencies]
encoders = ["transformers==5.16.1", "huggingface-hub>=0.34,<2"]
data = [
    "av>=14,<16",
    "pyarrow>=19,<22",
]
serve = [
    "msgpack>=1.0,<2",
    "websockets>=13,<16",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.14.3"]

[project.scripts]
flux-action = "flux_action.cli:main"

# PyPI's aarch64 torch wheels are CPU-only; the PyTorch index has CUDA 12.8 builds for both x86-64 and
# aarch64 (GB200, GH200). The marker keeps macOS on PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
